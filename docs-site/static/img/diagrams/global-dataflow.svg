<svg viewBox="0 0 1050 300" xmlns="http://www.w3.org/2000/svg" style="background-color: transparent; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15" />
    </filter>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3B82F6" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10B981" />
    </marker>
  </defs>

  <path d="M 230 140 L 290 140" stroke="#64748B" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  <text x="260" y="130" fill="#94A3B8" font-size="12" text-anchor="middle">ref.read()</text>

  <path d="M 480 140 L 540 140" stroke="#64748B" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  <text x="510" y="130" fill="#94A3B8" font-size="12" text-anchor="middle">Execute</text>

  <path d="M 730 140 L 790 140" stroke="#64748B" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  <text x="760" y="130" fill="#94A3B8" font-size="12" text-anchor="middle">HTTP Call</text>

  <path d="M 790 160 L 730 160" stroke="#3B82F6" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrowBlue)" />
  <text x="760" y="180" fill="#3B82F6" font-size="12" text-anchor="middle">JSON Response</text>

  <path d="M 540 160 L 480 160" stroke="#3B82F6" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrowBlue)" />
  <text x="510" y="180" fill="#3B82F6" font-size="12" text-anchor="middle">Parsed Model</text>

  <path d="M 290 160 L 230 160" stroke="#10B981" stroke-width="3" fill="none" marker-end="url(#arrowGreen)" />
  <text x="260" y="180" fill="#10B981" font-size="12" text-anchor="middle">Auto Rebuild</text>

  <rect x="50" y="100" width="180" height="100" rx="16" fill="url(#boxGrad)" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="140" fill="#F8FAFC" font-size="18" font-weight="bold" text-anchor="middle">💻 UI Widget</text>
  <text x="140" y="165" fill="#94A3B8" font-size="14" text-anchor="middle">ref.watch()</text>

  <rect x="300" y="100" width="180" height="100" rx="16" fill="url(#boxGrad)" stroke="#8B5CF6" stroke-width="2" filter="url(#shadow)"/>
  <text x="390" y="140" fill="#F8FAFC" font-size="18" font-weight="bold" text-anchor="middle">⚙️ Provider</text>
  <text x="390" y="165" fill="#94A3B8" font-size="14" text-anchor="middle">AsyncValue State</text>

  <rect x="550" y="100" width="180" height="100" rx="16" fill="url(#boxGrad)" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="140" fill="#F8FAFC" font-size="18" font-weight="bold" text-anchor="middle">📦 Repository</text>
  <text x="640" y="165" fill="#94A3B8" font-size="14" text-anchor="middle">Data Parsing</text>

  <rect x="800" y="100" width="180" height="100" rx="16" fill="url(#boxGrad)" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <text x="890" y="140" fill="#F8FAFC" font-size="18" font-weight="bold" text-anchor="middle">🌐 Backend</text>
  <text x="890" y="165" fill="#94A3B8" font-size="14" text-anchor="middle">REST API</text>
</svg>

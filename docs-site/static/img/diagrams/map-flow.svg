<svg viewBox="0 0 1050 300" xmlns="http://www.w3.org/2000/svg" style="background-color: transparent; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15" />
    </filter>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3B82F6" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10B981" />
    </marker>
  </defs>

  <path d="M 230 150 L 290 150" stroke="#64748B" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  <text x="260" y="140" fill="#94A3B8" font-size="12" text-anchor="middle">previewRoute()</text>

  <path d="M 480 150 L 540 150" stroke="#64748B" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  <text x="510" y="140" fill="#94A3B8" font-size="12" text-anchor="middle">Fetch Route</text>

  <path d="M 730 150 L 790 150" stroke="#64748B" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  <text x="760" y="140" fill="#94A3B8" font-size="12" text-anchor="middle">HTTP GET</text>

  <path d="M 790 170 L 730 170" stroke="#3B82F6" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrowBlue)" />
  <path d="M 540 170 L 480 170" stroke="#3B82F6" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrowBlue)" />
  <path d="M 290 170 L 230 170" stroke="#10B981" stroke-width="3" fill="none" marker-end="url(#arrowGreen)" />
  <text x="260" y="190" fill="#10B981" font-size="12" text-anchor="middle">Repaint Canvas</text>

  <rect x="50" y="100" width="180" height="100" rx="16" fill="url(#boxGrad)" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="140" fill="#F8FAFC" font-size="18" font-weight="bold" text-anchor="middle">💻 UI Layer</text>
  <text x="140" y="165" fill="#94A3B8" font-size="14" text-anchor="middle">MapPage</text>

  <rect x="300" y="100" width="180" height="100" rx="16" fill="url(#boxGrad)" stroke="#8B5CF6" stroke-width="2" filter="url(#shadow)"/>
  <text x="390" y="140" fill="#F8FAFC" font-size="18" font-weight="bold" text-anchor="middle">⚙️ Provider</text>
  <text x="390" y="165" fill="#94A3B8" font-size="14" text-anchor="middle">destinationProvider</text>

  <rect x="550" y="100" width="180" height="100" rx="16" fill="url(#boxGrad)" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="140" fill="#F8FAFC" font-size="18" font-weight="bold" text-anchor="middle">📦 Repository</text>
  <text x="640" y="165" fill="#94A3B8" font-size="14" text-anchor="middle">MapRepository</text>

  <rect x="800" y="100" width="180" height="100" rx="16" fill="url(#boxGrad)" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <text x="890" y="140" fill="#F8FAFC" font-size="18" font-weight="bold" text-anchor="middle">🌐 Backend</text>
  <text x="890" y="165" fill="#94A3B8" font-size="14" text-anchor="middle">Dio (/route/preview)</text>
</svg>
